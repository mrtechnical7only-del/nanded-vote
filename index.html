                        let u = null;

                            const cred = await auth.signInWithCustomToken(__initial_auth_token);
                            u = cred.user;
                        } else {
                            const cred = await auth.signInAnonymously();
                            u = cred.user;
                        }

                            // Rule 1 Path
                            const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('voters').doc('mainDoc');
                            
                            // Rule 2 Simple Query / Snapshot with mandatory error callback
                            unsubscribeSnapshot = docRef.onSnapshot(

                                    setFirebaseConnected(false);
                                    if (err.code === 'permission-denied') {
                                        setFirebaseError("Permission Denied: Firebase Console -> Firestore Database -> Rules me 'allow read, write: if true;' karein.");
                                    } else {
                                        setFirebaseError("Firestore Error: " + err.message);
                                    }
                                }
                            );
                        }

                            setFirebaseError("Firebase Auth Error: " + (e.message || "Connection failed"));

                    }
                };

                initFirebaseSync();

                return () => {
                    if (unsubscribeSnapshot) unsubscribeSnapshot();
                };

                                    localStorage.setItem("SIR_REGISTER_VOTERS_2026", JSON.stringify(data.records));
                                }
                            }
                        }, err => console.log("Firebase listener error:", err));
                    }
                });

                setRecords(newRecords);
                setHasUnsaved(true);
                localStorage.setItem("SIR_REGISTER_VOTERS_2026", JSON.stringify(newRecords));
                if (db && user) {
                    saveAllChanges(newRecords);
                }
            };

            // Quick Toggle Ground 4 and 11
            const handleToggle4and11 = (id) => {
                const updated = records.map(item => {
                    if (item.id === id) {
                        let newCode = item.anomaly;
                        if (item.anomaly.includes("11")) {
                            newCode = item.anomaly.replace("11", "4");
                        } else if (item.anomaly.includes("4")) {
                            newCode = item.anomaly.replace("4", "11");
                        }
                        return { ...item, anomaly: newCode };
                    }
                    return item;
                });
                updateStateAndSave(updated);
                showToast("⚡ Ground 4 ↔ 11 Switched & Firebase Sync Saved!");
            };

            // Icons init
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, selectedRecord, showAddModal, editingRecord, showExportModal, records, searchQuery]);

            const parseAnomalyCodes = (anomalyStr) => {
                if (!anomalyStr) return [];
                return anomalyStr.toString().split('/').map(s => s.trim());
            };

            // Filter logic
            const filteredRecords = useMemo(() => {
                const q = searchQuery.toLowerCase().trim();
                return records.filter(item => {
                    const matchSearch = q === "" || 
                        item.sr.toString().toLowerCase().includes(q) ||
                        (item.name && item.name.toLowerCase().includes(q)) ||
                        (item.epic && item.epic.toLowerCase().includes(q));
                    
                    const itemAnomalies = parseAnomalyCodes(item.anomaly);
                    const matchAnomaly = filterAnomaly === "ALL" || itemAnomalies.includes(filterAnomaly);
                    const matchMapping = filterMapping === "ALL" || item.mapping === filterMapping;

                    return matchSearch && matchAnomaly && matchMapping;
                });
            }, [records, searchQuery, filterAnomaly, filterMapping]);

            // Stats
            const stats = useMemo(() => {
                const total = records.length;
                const selfCount = records.filter(r => r.mapping === 'S').length;
                const progenyCount = records.filter(r => r.mapping === 'P').length;

                const freq = {};
                records.forEach(r => {
                    const codes = parseAnomalyCodes(r.anomaly);
                    codes.forEach(c => {
                        freq[c] = (freq[c] || 0) + 1;
                    });
                });

                return { total, selfCount, progenyCount, freq };
            }, [records]);

            // Edit record
            const handleSaveEdit = (e) => {
                e.preventDefault();
                if (!editingRecord) return;
                const updated = records.map(r => r.id === editingRecord.id ? editingRecord : r);
                updateStateAndSave(updated);
                setEditingRecord(null);
                showToast("✓ Voter Record Edit Saved!");
            };

            // Add record
            const handleAddRecord = (e) => {
                e.preventDefault();
                if (!newSr.trim() || !newName.trim()) return;

                const newEntry = {
                    id: Date.now(),
                    sr: newSr.trim(),
                    name: newName.trim(),
                    epic: newEpic.trim().toUpperCase() || "N/A",
                    mapping: newMapping,
                    anomaly: newAnomaly.trim()
                };

                const updated = [newEntry, ...records];
                updateStateAndSave(updated);
                setNewSr("");
                setNewName("");
                setNewEpic("");
                setShowAddModal(false);
                showToast("✓ Naya Voter Added & Saved!");
            };

            // Delete record
            const handleDeleteRecord = (id) => {
                if (confirm("Kya aap is voter record ko delete karna chahte hain?")) {
                    const updated = records.filter(r => r.id !== id);
                    updateStateAndSave(updated);
                    if (selectedRecord && selectedRecord.id === id) {
                        setSelectedRecord(null);
                    }
                    showToast("🗑 Voter Record Deleted & Saved!");
                }
            };

            // GENERATE COMPLETE SINGLE-FILE INDEX.HTML FOR GITHUB PAGES
            const generateFullSingleFileHtml = () => {
                const docHtml = document.documentElement.outerHTML;
                const recordsJson = JSON.stringify(records, null, 8);
                const updatedHtml = docHtml.replace(
                    /const INITIAL_REGISTER_DATA = \[[\s\S]*?\];/,
                    `const INITIAL_REGISTER_DATA = ${recordsJson};`
                );
                return "<!DOCTYPE html>\n<html lang=\"hi\">\n" + updatedHtml + "\n</html>";
            };

            // Download index.html file
            const downloadIndexHtmlFile = () => {
                const htmlContent = generateFullSingleFileHtml();
                const blob = new Blob([htmlContent], { type: "text/html" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "index.html";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast("📥 Ready index.html File Downloaded For GitHub Pages!");
            };

            // Copy HTML to Clipboard
            const copyFullCodeToClipboard = () => {
                const htmlContent = generateFullSingleFileHtml();
                const textarea = document.createElement('textarea');
                textarea.value = htmlContent;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast("📋 Complete index.html Code Copied To Clipboard!");
            };

            return (
                <div className="min-h-screen flex flex-col relative">
                    
                    {/* Toast Notification */}
                    {toastMsg && (
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white font-bold px-5 py-3 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-3 animate-bounce">
                            <i data-lucide="check-circle-2" className="w-5 h-5 text-emerald-400"></i>
                            <span className="text-sm">{toastMsg}</span>
                        </div>
                    )}

                    {/* Top Header */}
                    <header className="bg-gradient-to-r from-slate-900 via-indigo-950 to-blue-900 text-white shadow-xl no-print">
                        <div className="max-w-7xl mx-auto px-4 py-5 sm:px-6 lg:px-8">
                            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                <div className="flex items-center gap-3">
                                    <div className="bg-white/10 p-3 rounded-2xl border border-white/20 backdrop-blur-md">
                                        <i data-lucide="shield-check" className="w-8 h-8 text-yellow-400"></i>
                                    </div>
                                    <div>
                                        <div className="flex items-center gap-2">
                                            <span className="bg-yellow-400 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded tracking-wider uppercase">SIR UPDATE 2026</span>
                                            <span className="text-xs text-blue-200">Discrepancy & Anomaly Verification Portal</span>
                                        </div>
                                        <h1 className="text-xl sm:text-2xl font-black tracking-tight mt-0.5">Voter Register & Anomaly Analyzer</h1>
                                    </div>
                                </div>

                                <div className="flex flex-wrap items-center gap-2 self-start md:self-auto">
                                    
                                    {/* Firebase Live Badge */}
                                    <div className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 border ${
                                        firebaseConnected 
                                            ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' 
                                            : firebaseError
                                            ? 'bg-red-500/20 text-red-300 border-red-500/30'
                                            : 'bg-amber-500/20 text-amber-300 border-amber-500/30'
                                    }`}>
                                        <span className={`w-2 h-2 rounded-full ${firebaseConnected ? 'bg-emerald-400 animate-ping' : 'bg-red-400'}`}></span>
                                        {firebaseConnected ? '🔥 voters-ac217 Connected' : firebaseError ? '⚠️ Firebase Issue' : 'Connecting...'}
                                    </div>

                                    {/* Save Button */}
                                    <button 
                                        onClick={() => saveAllChanges()}
                                        disabled={isSaving}
                                        className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-black flex items-center gap-2 shadow-lg transition-all active:scale-95 ${
                                            hasUnsaved 
                                                ? "bg-amber-500 hover:bg-amber-400 text-slate-950 animate-pulse" 
                                                : "bg-emerald-600 hover:bg-emerald-500 text-white"
                                        }`}
                                    >
                                        <i data-lucide="save" className="w-4 h-4"></i>
                                        {isSaving ? "Saving..." : hasUnsaved ? "💾 Save Changes Required" : "✓ Saved"}
                                    </button>

                                    {/* Export / Download Code Button */}
                                    <button 
                                        onClick={() => setShowExportModal(true)}
                                        className="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 shadow-md transition-all"
                                    >
                                        <i data-lucide="github" className="w-4 h-4"></i>
                                        Export index.html
                                    </button>

                                    <button 
                                        onClick={() => setShowAddModal(true)}
                                        className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 shadow-md transition-all"
                                    >
                                        <i data-lucide="user-plus" className="w-4 h-4"></i>
                                        Add Voter
                                    </button>
                                </div>
                            </div>

                            {/* Stat Chips */}
                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-6 pt-4 border-t border-white/10">
                                <div className="bg-white/5 rounded-xl p-3 border border-white/10">
                                    <p className="text-[11px] text-slate-300 font-medium">Total Flagged Voters</p>
                                    <p className="text-2xl font-black text-white mt-0.5">{stats.total}</p>
                                </div>
                                <div className="bg-white/5 rounded-xl p-3 border border-white/10">
                                    <p className="text-[11px] text-blue-300 font-medium">Ground 4 (Grandparent Gap)</p>
                                    <p className="text-2xl font-black text-blue-300 mt-0.5">{stats.freq['4'] || 0}</p>
                                </div>
                                <div className="bg-white/5 rounded-xl p-3 border border-white/10">
                                    <p className="text-[11px] text-yellow-300 font-medium">Ground 11 (Father Mismatch)</p>
                                    <p className="text-2xl font-black text-yellow-300 mt-0.5">{stats.freq['11'] || 0}</p>
                                </div>
                                <div className="bg-white/5 rounded-xl p-3 border border-white/10">
                                    <p className="text-[11px] text-purple-300 font-medium">Progeny (P) Count</p>
                                    <p className="text-2xl font-black text-purple-300 mt-0.5">{stats.progenyCount}</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Firebase Diagnostic Status Banner */}
                    {firebaseError && (
                        <div className="bg-red-500 text-white px-4 py-3 shadow-md no-print border-b border-red-600">
                            <div className="max-w-7xl mx-auto flex items-center justify-between text-xs font-bold gap-2">
                                <div className="flex items-center gap-2">
                                    <i data-lucide="alert-triangle" className="w-5 h-5 flex-shrink-0"></i>
                                    <span>FIREBASE CONNECT ISSUE: {firebaseError}</span>
                                </div>
                                <button 
                                    onClick={() => window.location.reload()} 
                                    className="bg-white text-red-900 px-3 py-1 rounded-lg text-xs font-black shadow hover:bg-slate-100"
                                >
                                    Retry Connection
                                </button>
                            </div>
                        </div>
                    )}

                    {/* MODAL 2: Individual Voter Notice Sheet */}
                    {selectedRecord && (
                        <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 no-print">
                            <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-200">
                                
                                <div className="bg-gradient-to-r from-blue-950 via-indigo-900 to-slate-900 text-white p-6 rounded-t-3xl relative">
                                    <button 
                                        onClick={() => setSelectedRecord(null)}
                                        className="absolute right-5 top-5 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-2 rounded-full transition-colors"
                                    >
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                    <span className="bg-yellow-400 text-slate-950 font-black text-xs px-2.5 py-1 rounded tracking-wider">
                                        ELECTION VERIFICATION NOTICE SHEET
                                    </span>
                                    
                                    <div className="mt-3 space-y-1">
                                        <h2 className="text-2xl font-black">
                                            {selectedRecord.name || "Elector Name"}
                                        </h2>
                                        <div className="flex flex-wrap gap-3 text-xs text-blue-200">
                                            <span>EPIC NO: <strong className="text-white font-mono">{selectedRecord.epic || "N/A"}</strong></span>
                                            <span>•</span>
                                            <span>SERIAL NO: <strong className="text-white font-mono">{selectedRecord.sr}</strong></span>
                                            <span>•</span>
                                            <span>CATEGORY: <strong className="text-yellow-300">{selectedRecord.mapping === 'S' ? 'SELF' : 'PROGENY'}</strong></span>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-6 space-y-6">
                                    <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl flex items-start gap-3">
                                        <i data-lucide="shield-alert" className="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5"></i>
                                        <div className="text-xs text-amber-950">
                                            <p className="font-bold text-sm">NOTICE KA MATLAB REJECT HONA NAHI HAI</p>
                                            <p className="mt-0.5">Yeh sirf verification ke liye hai. Niche diye gaye required documents BLO ko dikha kar clear karayein.</p>
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <h3 className="font-bold text-slate-900 text-sm border-b pb-2 flex items-center justify-between">
                                            <span>Flagged Discrepancy Grounds</span>
                                            <span className="text-xs font-normal text-slate-500">SIR Update 2026</span>
                                        </h3>

                                        {parseAnomalyCodes(selectedRecord.anomaly).map((code, idx) => {
                                            const ground = ANOMALY_GROUNDS[code];
                                            return (
                                                <div key={idx} className="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3">
                                                    <div className="flex items-center justify-between">
                                                        <span className="bg-amber-100 text-amber-950 font-black px-2.5 py-0.5 rounded text-xs">
                                                            ANOMALY GROUND #{code}
                                                        </span>
                                                        <span className="text-xs font-bold text-slate-700">
                                                            {ground?.title}
                                                        </span>
                                                    </div>

                                                    <p className="text-sm font-bold text-slate-800">
                                                        {ground?.desc}
                                                    </p>

                                                    <div className="bg-white p-3 rounded-xl border border-slate-200 text-xs">
                                                        <span className="font-bold text-slate-500 block mb-1">Required Verification Documents:</span>
                                                        <div className="flex flex-wrap gap-1.5 mt-1">
                                                            {ground?.docs.map((doc, dIdx) => (
                                                                <span key={dIdx} className="bg-blue-50 text-blue-900 px-2 py-1 rounded border border-blue-200 font-semibold">
                                                                    ✓ {doc}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>

                                                    <div className="text-xs font-bold text-emerald-700 flex items-center gap-1.5">
                                                        <i data-lucide="check-circle" className="w-4 h-4 text-emerald-600"></i>
                                                        Action Required: {ground?.solution}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="border-t border-slate-200 pt-4 space-y-2">
                                        <h4 className="font-bold text-xs uppercase text-slate-500 tracking-wider">
                                            BLO Verification Checklist
                                        </h4>
                                        <label className="flex items-center gap-2 text-xs text-slate-700 font-medium cursor-pointer">
                                            <input type="checkbox" className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4" />
                                            Aadhaar / Passport / DOB Proof verified
                                        </label>
                                        <label className="flex items-center gap-2 text-xs text-slate-700 font-medium cursor-pointer">
                                            <input type="checkbox" className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4" />
                                            Family relation / Progeny mapping checked
                                        </label>
                                        <label className="flex items-center gap-2 text-xs text-slate-700 font-medium cursor-pointer">
                                            <input type="checkbox" className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4" />
                                            Verification report updated in BLO App
                                        </label>
                                    </div>

                                </div>

                                <div className="bg-slate-50 p-4 rounded-b-3xl border-t border-slate-200 flex justify-between items-center">
                                    <button 
                                        onClick={() => window.print()}
                                        className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-colors shadow-sm"
                                    >
                                        <i data-lucide="printer" className="w-4 h-4"></i>
                                        Print Notice Slip
                                    </button>
                                    <button 
                                        onClick={() => setSelectedRecord(null)}
                                        className="bg-slate-900 text-white font-bold px-5 py-2 rounded-xl text-xs hover:bg-slate-800 transition-colors"
                                    >
                                        Close
                                    </button>
                                </div>

                            </div>
                        </div>
                    )}

                    {/* MODAL 3: Edit Record Modal */}
                    {editingRecord && (
                        <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 no-print">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-lg text-slate-900 flex items-center gap-2">
                                        <i data-lucide="edit-3" className="w-5 h-5 text-blue-600"></i>
                                        Edit Voter Entry & Save
                                    </h3>
                                    <button onClick={() => setEditingRecord(null)} className="text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleSaveEdit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                                            Elector Name
                                        </label>
                                        <input 
                                            type="text"
                                            value={editingRecord.name}
                                            onChange={(e) => setEditingRecord({ ...editingRecord, name: e.target.value })}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm font-bold"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                                            EPIC Number
                                        </label>
                                        <input 
                                            type="text"
                                            value={editingRecord.epic}
                                            onChange={(e) => setEditingRecord({ ...editingRecord, epic: e.target.value })}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm font-mono uppercase"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                                            Serial Number (SR NO)
                                        </label>
                                        <input 
                                            type="text"
                                            value={editingRecord.sr}
                                            onChange={(e) => setEditingRecord({ ...editingRecord, sr: e.target.value })}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm font-bold"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                                            Anomaly Ground Code(s)
                                        </label>
                                        <input 
                                            type="text"
                                            value={editingRecord.anomaly}
                                            onChange={(e) => setEditingRecord({ ...editingRecord, anomaly: e.target.value })}
                                            placeholder="e.g. 4 ya 11 ya 5/9"
                                            className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm font-bold"
                                        />
                                    </div>

                                    <div className="pt-3 flex gap-2">
                                        <button 
                                            type="button"
                                            onClick={() => setEditingRecord(null)}
                                            className="w-1/2 py-2.5 text-xs font-bold text-slate-700 bg-slate-100 rounded-xl hover:bg-slate-200"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit"
                                            className="w-1/2 py-2.5 text-xs font-bold text-white bg-blue-600 rounded-xl hover:bg-blue-500 shadow-md"
                                        >
                                            Save Changes
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL 4: Add New Voter Entry */}
                    {showAddModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 no-print">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-lg text-slate-900 flex items-center gap-2">
                                        <i data-lucide="user-plus" className="w-5 h-5 text-emerald-600"></i>
                                        Add New Voter Entry
                                    </h3>
                                    <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleAddRecord} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                                            Elector's Name
                                        </label>
                                        <input 
                                            type="text"
                                            required
                                            value={newName}
                                            onChange={(e) => setNewName(e.target.value)}
                                            placeholder="e.g. MOHAMMED AHMAD"
                                            className="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 text-sm outline-none font-bold"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                                            EPIC Number
                                        </label>
                                        <input 
                                            type="text"
                                            value={newEpic}
                                            onChange={(e) => setNewEpic(e.target.value)}
                                            placeholder="e.g. TIA3636982"
                                            className="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 text-sm outline-none font-mono uppercase"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                                            Serial Number (SR NO)
                                        </label>
                                        <input 
                                            type="text"
                                            required
                                            value={newSr}
                                            onChange={(e) => setNewSr(e.target.value)}
                                            placeholder="e.g. 1072"
                                            className="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 text-sm outline-none font-bold"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                                            Mapping Category
                                        </label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button
                                                type="button"
                                                onClick={() => setNewMapping("S")}
                                                className={`py-2 text-xs font-bold rounded-xl border ${newMapping === 'S' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-700 border-slate-300'}`}
                                            >
                                                SELF (S)
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setNewMapping("P")}
                                                className={`py-2 text-xs font-bold rounded-xl border ${newMapping === 'P' ? 'bg-purple-600 text-white border-purple-600' : 'bg-slate-50 text-slate-700 border-slate-300'}`}
                                            >
                                                PROGENY (P)
                                            </button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                                            Anomaly Ground Code(s)
                                        </label>
                                        <input 
                                            type="text"
                                            required
                                            value={newAnomaly}
                                            onChange={(e) => setNewAnomaly(e.target.value)}
                                            placeholder="e.g. 4 ya 11 ya 5/9"
                                            className="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 text-sm outline-none font-medium"
                                        />
                                    </div>

                                    <div className="pt-3 flex gap-2">
                                        <button 
                                            type="button"
                                            onClick={() => setShowAddModal(false)}
                                            className="w-1/2 py-2.5 text-xs font-bold text-slate-700 bg-slate-100 rounded-xl hover:bg-slate-200"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit"
                                            className="w-1/2 py-2.5 text-xs font-bold text-white bg-emerald-600 rounded-xl hover:bg-emerald-500 shadow-md"
                                        >
                                            Save Entry
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800 no-print mt-auto">
                        <p>© 2026 Electoral Roll Verification Portal. JANKARI HI SURAKSHA HAI – SAHI BHARO, SAHI RAHO!</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
