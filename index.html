<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanded Waghala Election Results 2026</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20">

    <!-- Header -->
    <header class="bg-blue-800 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white p-2 rounded-full shadow-md">
                    <i data-lucide="map-pin" class="text-blue-800 w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold uppercase tracking-tight">NWMC Nanded Results 2026</h1>
                    <p class="text-blue-100 text-sm italic">Winners vs Runners-up Details (Ward 1-20)</p>
                </div>
            </div>
            <div class="flex gap-2 text-xs font-bold uppercase tracking-wider bg-blue-900/50 px-3 py-1.5 rounded-full border border-blue-700">
                <span class="flex items-center gap-1">
                    <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div> LIVE DATA
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        <!-- Party Summary Section -->
        <section class="mb-8">
            <div class="flex items-center gap-2 mb-4 text-blue-800 font-bold">
                <i data-lucide="bar-chart-3"></i>
                <h2 class="text-xl">Party Standings (81 Total Seats)</h2>
            </div>
            <div id="party-summary" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-3">
                <!-- Data will be injected here -->
            </div>
        </section>

        <!-- Search Bar -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-8">
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                <input 
                    type="text" 
                    id="search-input"
                    placeholder="Winner ya Runner-up ka naam search karein..." 
                    class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                >
            </div>
        </section>

        <!-- Results Grid -->
        <section>
            <div class="flex items-center gap-2 mb-4 text-blue-800 font-bold">
                <i data-lucide="users"></i>
                <h2 class="text-xl">Muqabla: Kaun Jeeta, Kaun Hara?</h2>
            </div>
            <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Election Cards will be injected here -->
            </div>
        </section>
    </main>

    <footer class="mt-12 py-12 bg-white border-t border-gray-100 text-center">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">NWMC Nanded Election Archive 2026</p>
        <p class="text-[10px] text-gray-400 mt-2 italic">Created for GitHub Hosting</p>
    </footer>

    <script>
        // Election Data
        const electionData = [
            { prabhag: '1', seat: 'A', winner: 'Rawat Shravasti', party: 'BJP', votes: '4,822', runnerUp: 'Dudhmal Ratna', runnerUpParty: 'Shiv Sena (S)', margin: '1,051' },
            { prabhag: '1', seat: 'B', winner: 'Munde Yogesh', party: 'Shiv Sena (S)', votes: '5,573', runnerUp: 'Deepak Patil', runnerUpParty: 'BJP', margin: '248' },
            { prabhag: '1', seat: 'C', winner: 'Kalyan Jyoti Kishan', party: 'BJP', votes: '6,675', runnerUp: 'Bhalerao Surekha', runnerUpParty: 'Congress', margin: '3,737' },
            { prabhag: '1', seat: 'D', winner: 'Kalyankar Subhash', party: 'Shiv Sena (S)', votes: '6,119', runnerUp: 'Dinesh Mortale', runnerUpParty: 'BJP', margin: '8' },
            { prabhag: '2', seat: 'A', winner: 'Sunita Rupakrao', party: 'Vanchit', votes: '5,209', runnerUp: 'Ashwini Savte', runnerUpParty: 'BJP', margin: '666' },
            { prabhag: '2', seat: 'B', winner: 'Afiya Khazi Nafe', party: 'Congress', votes: '5,892', runnerUp: 'Topekar Sakharam', runnerUpParty: 'BJP', margin: '1,042' },
            { prabhag: '2', seat: 'C', winner: 'Mole Kavita', party: 'BJP', votes: '4,957', runnerUp: 'Kalyankar Anand', runnerUpParty: 'Congress', margin: '171' },
            { prabhag: '2', seat: 'D', winner: 'Satish Deshmukh', party: 'BJP', votes: '4,367', runnerUp: 'Sandeep Deshmukh', runnerUpParty: 'Congress', margin: '688' },
            { prabhag: '3', seat: 'A', winner: 'Sarita Umesh Pawde', party: 'BJP', votes: '5,270', runnerUp: 'Gajbare Pratiksha', runnerUpParty: 'Shiv Sena', margin: '1,043' },
            { prabhag: '3', seat: 'B', winner: 'Puri Sadashiv Shankar', party: 'BJP', votes: '4,772', runnerUp: 'Sushil Chauhan', runnerUpParty: 'Shiv Sena', margin: '537' },
            { prabhag: '3', seat: 'C', winner: 'Meenal Patil', party: 'Azad', votes: '4,993', runnerUp: 'Kokate Karuna', runnerUpParty: 'Shiv Sena', margin: '1,925' },
            { prabhag: '3', seat: 'D', winner: 'Gadjole Sandeep', party: 'Shiv Sena', votes: '4,926', runnerUp: 'Kokate Shriram', runnerUpParty: 'BJP', margin: '35' },
            { prabhag: '7', seat: 'A', winner: 'Rahul Madhukarrao', party: 'Vanchit', votes: '5,910', runnerUp: 'Rao Bhole Subhash', runnerUpParty: 'SV Aghadi', margin: '845' },
            { prabhag: '11', seat: 'A', winner: 'Asiya Begum', party: 'AIMIM', votes: '9,667', runnerUp: 'Zarina Begum', runnerUpParty: 'Congress', margin: '1,908' },
            { prabhag: '11', seat: 'D', winner: 'Mohd Masood Ahmed', party: 'AIMIM', votes: '10,081', runnerUp: 'Mohd Ateeq', runnerUpParty: 'Congress', margin: '3,749' },
            { prabhag: '12', seat: 'A', winner: 'Abdul Gaffar', party: 'Congress', votes: '11,735', runnerUp: 'Abdul Rasheed', runnerUpParty: 'AIMIM', margin: '4,404' },
            { prabhag: '15', seat: 'B', winner: 'Sumaiya Gulfisha', party: 'AIMIM', votes: '4,973', runnerUp: 'Raisa Begum', runnerUpParty: 'NCP', margin: '22' },
            { prabhag: '19', seat: 'A', winner: 'Abhishek Ramesh Rao', party: 'BJP', votes: '8,372', runnerUp: 'Bhimrao Narayan', runnerUpParty: 'Shiv Sena', margin: '49' },
            { prabhag: '20', seat: 'A', winner: 'Landge Narchna', party: 'BJP', votes: '11,270', runnerUp: 'Deepmala Gaikwad', runnerUpParty: 'Vanchit', margin: '811' }
        ];

        const partySummary = [
            { name: 'BJP', seats: 45, color: 'bg-orange-500' },
            { name: 'AIMIM', seats: 14, color: 'bg-green-700' },
            { name: 'Congress', seats: 10, color: 'bg-blue-600' },
            { name: 'Vanchit', seats: 5, color: 'bg-blue-900' },
            { name: 'Shiv Sena', seats: 4, color: 'bg-yellow-500' },
            { name: 'NCP', seats: 2, color: 'bg-green-500' },
            { name: 'Azad', seats: 1, color: 'bg-gray-500' }
        ];

        // Function to render Party Summary
        function renderSummary() {
            const container = document.getElementById('party-summary');
            container.innerHTML = partySummary.map(p => `
                <div class="${p.color} p-4 rounded-xl shadow-sm border border-black/5 text-white">
                    <p class="text-[10px] font-bold opacity-75 uppercase">${p.name}</p>
                    <h3 class="text-3xl font-black">${p.seats}</h3>
                </div>
            `).join('');
        }

        // Function to render Result Cards
        function renderResults(filter = '') {
            const container = document.getElementById('results-grid');
            const filtered = electionData.filter(item => 
                item.winner.toLowerCase().includes(filter.toLowerCase()) || 
                item.runnerUp.toLowerCase().includes(filter.toLowerCase()) ||
                item.prabhag.includes(filter)
            );

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full py-20 text-center text-gray-400">Result nahi mila.</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="bg-white rounded-3xl border border-gray-200 shadow-sm overflow-hidden flex flex-col">
                    <div class="bg-gray-50 px-6 py-3 border-b border-gray-100 flex justify-between items-center">
                        <span class="text-sm font-black text-blue-800">PRABHAG ${item.prabhag}-${item.seat}</span>
                        <span class="text-[10px] font-bold text-green-600 bg-green-50 px-2 py-1 rounded-full uppercase tracking-widest">Final Result</span>
                    </div>

                    <div class="p-6 flex flex-col gap-6 flex-1">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center shrink-0">
                                <i data-lucide="award" class="w-8 h-8 text-blue-600"></i>
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-start">
                                    <h3 class="text-xl font-black text-gray-900">${item.winner}</h3>
                                    <span class="text-[10px] font-bold px-2 py-1 rounded-md bg-blue-800 text-white">${item.party}</span>
                                </div>
                                <p class="text-sm font-bold text-blue-700 mt-1 uppercase tracking-tighter">Winner (${item.votes} Votes)</p>
                            </div>
                        </div>

                        <div class="relative flex items-center justify-center">
                            <div class="absolute w-full h-px bg-gray-100"></div>
                            <span class="relative bg-white px-4 text-xs font-black text-gray-300">VS</span>
                        </div>

                        <div class="flex items-center gap-4 opacity-75">
                            <div class="w-14 h-14 bg-gray-100 rounded-2xl flex items-center justify-center shrink-0">
                                <i data-lucide="user-minus" class="w-8 h-8 text-gray-400"></i>
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-start">
                                    <h4 class="text-lg font-bold text-gray-600">${item.runnerUp}</h4>
                                    <span class="text-[10px] font-bold bg-gray-200 text-gray-600 px-2 py-1 rounded-md">${item.runnerUpParty}</span>
                                </div>
                                <p class="text-xs font-bold text-red-400 mt-1 uppercase tracking-tighter">Runner-up (Lost by ${item.margin} votes)</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-blue-50/50 px-6 py-4 border-t border-gray-50 mt-auto">
                        <p class="text-xs font-medium text-gray-500 text-center">
                            <span class="font-black text-blue-800">${item.winner}</span> ne <span class="font-black text-red-500">${item.margin}</span> votes ke farq se jeet hasil ki.
                        </p>
                    </div>
                </div>
            `).join('');
            
            // Re-initialize icons
            lucide.createIcons();
        }

        // Search Listener
        document.getElementById('search-input').addEventListener('input', (e) => {
            renderResults(e.target.value);
        });

        // Initial Load
        window.onload = () => {
            renderSummary();
            renderResults();
            lucide.createIcons();
        };
    </script>
</body>
</html>
