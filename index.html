        const partySummaryData = [
            { name: 'BJP', seats: 45, color: 'bg-orange-500' },
            { name: 'AIMIM', seats: 14, color: 'bg-green-700' },
            { name: 'Congress', seats: 10, color: 'bg-blue-600' },
            { name: 'Vanchit', seats: 5, color: 'bg-blue-900' },
            { name: 'Shiv Sena', seats: 4, color: 'bg-yellow-500' },
            { name: 'NCP', seats: 2, color: 'bg-green-500' },
            { name: 'Azad', seats: 1, color: 'bg-gray-500' }
        ];

        function renderSummary() {
            const container = document.getElementById('party-summary');
            container.innerHTML = partySummaryData.map(p => `
                <div class="party-card ${p.color} p-4 rounded-xl shadow-sm border-2 ${selectedParty === p.name ? 'active' : 'border-transparent'} text-white" 
                     onclick="filterByParty('${p.name}')">
                    <p class="text-[10px] font-bold opacity-75 uppercase tracking-tighter">${p.name}</p>
                    <h3 class="text-3xl font-black">${p.seats}</h3>
                </div>
            `).join('');

            const resetBtn = document.getElementById('reset-btn');
            selectedParty !== 'All' ? resetBtn.classList.remove('hidden') : resetBtn.classList.add('hidden');
        }

        function filterByParty(party) {
            selectedParty = (selectedParty === party) ? 'All' : party;
            renderSummary();
            renderResults();
        }

        document.getElementById('reset-btn').onclick = () => {
            selectedParty = 'All';
            renderSummary();
            renderResults();
        }

        function openModal(id) {
            const ward = electionData[id];
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            const totalEl = document.getElementById('total-valid-votes');

            const sorted = [...ward.candidates].sort((a,b) => b.votes - a.votes);
            const totalVotes = sorted.reduce((sum, c) => sum + c.votes, 0);

            title.innerText = `Prabhag ${ward.prabhag}-${ward.seat} Detailed Muqabla`;
            totalEl.innerText = `Total Votes Polled: ${totalVotes.toLocaleString()}`;

            body.innerHTML = sorted.map(c => `
                <tr class="candidate-row hover:bg-blue-50/50 transition-colors">
                    <td class="py-4 px-4 text-sm font-bold ${c.name === ward.winner ? 'text-green-600' : 'text-gray-700'} border-b">
                        ${c.name} ${c.name === ward.winner ? '<span class="ml-2 text-[10px] bg-green-100 px-2 py-0.5 rounded-full border border-green-200">WINNER</span>' : ''}
                    </td>
                    <td class="py-4 px-4 text-xs font-semibold text-gray-500 border-b italic">${c.party}</td>
                    <td class="py-4 px-4 text-sm font-black text-blue-800 border-b text-right">${c.votes.toLocaleString()}</td>
                </tr>
            `).join('');

            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        function renderResults() {
            const filterText = document.getElementById('search-input').value.toLowerCase();
            const container = document.getElementById('results-grid');
            const countEl = document.getElementById('results-count');
            const titleEl = document.getElementById('results-title');

            const filtered = electionData.filter(item => {
                const matchesParty = selectedParty === 'All' || item.party === selectedParty || (selectedParty === 'Shiv Sena' && item.party.includes('Shiv Sena'));
                const matchesSearch = item.winner.toLowerCase().includes(filterText) || 
                                     item.prabhag.includes(filterText) ||
                                     item.candidates.some(c => c.name.toLowerCase().includes(filterText));
                return matchesParty && matchesSearch;
            }).sort((a, b) => {
                if(parseInt(a.prabhag) !== parseInt(b.prabhag)) return parseInt(a.prabhag) - parseInt(b.prabhag);
                return a.seat.localeCompare(b.seat);
            });

            titleEl.innerText = selectedParty === 'All' ? 'Ward Muqabla Details' : `${selectedParty} Winners & Muqabla`;
            countEl.innerText = `${filtered.length} / 81 Seats`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full py-20 text-center text-gray-400 italic">No data found in this category.</div>`;
                return;
            }

            container.innerHTML = filtered.map((item, idx) => {
                const sorted = [...item.candidates].sort((a,b) => b.votes - a.votes);
                const runnerUp = sorted[1] || {name: 'N/A', party: 'N/A', votes: 0};
                const margin = item.votes - runnerUp.votes;

                return `
                <div class="bg-white rounded-3xl border border-gray-200 shadow-sm overflow-hidden flex flex-col hover:border-blue-400 hover:shadow-md transition-all">
                    <div class="bg-gray-50 px-6 py-3 border-b border-gray-100 flex justify-between items-center">
                        <span class="text-sm font-black text-blue-800 tracking-wider">WARD ${item.prabhag}-${item.seat}</span>
                        <span class="text-[10px] font-bold text-green-600 bg-green-50 px-2 py-1 rounded-full border border-green-100 uppercase tracking-tighter">Official</span>
                    </div>

                    <div class="p-6 flex flex-col gap-6 flex-1">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center shrink-0">
                                <i data-lucide="award" class="w-8 h-8 text-blue-600"></i>
                            </div>
                            <div class="flex-1 overflow-hidden">
                                <div class="flex justify-between items-start">
                                    <h3 class="text-lg font-black text-gray-900 leading-tight truncate">${item.winner}</h3>
                                    <span class="text-[10px] font-bold px-2 py-1 rounded-md bg-blue-800 text-white ml-2 shrink-0">${item.party}</span>
                                </div>
                                <p class="text-sm font-bold text-blue-700 mt-1 uppercase tracking-tighter">${item.votes.toLocaleString()} Votes</p>
                            </div>
                        </div>

                        <div class="relative flex items-center justify-center">
                            <div class="absolute w-full h-px bg-gray-100"></div>
                            <span class="relative bg-white px-4 text-[10px] font-black text-gray-300 uppercase tracking-widest">VS Muqabla</span>
                        </div>

                        <div class="flex items-center gap-4 opacity-75">
                            <div class="w-14 h-14 bg-gray-100 rounded-2xl flex items-center justify-center shrink-0">
                                <i data-lucide="user-minus" class="w-8 h-8 text-gray-400"></i>
                            </div>
                            <div class="flex-1 overflow-hidden">
                                <h4 class="text-md font-bold text-gray-600 truncate">${runnerUp.name}</h4>
                                <p class="text-xs font-bold text-red-400 mt-1 uppercase italic">Lost by ${margin.toLocaleString()} votes</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-blue-50/30 px-6 py-4 border-t border-gray-50 mt-auto flex justify-between items-center">
                        <button onclick="openModal(${electionData.indexOf(item)})" class="text-xs font-black text-blue-800 hover:text-blue-900 flex items-center gap-1 uppercase tracking-tighter group transition-all">
                            View All ${item.candidates.length} Candidates <i data-lucide="chevron-right" class="w-3 h-3 group-hover:translate-x-1 transition-transform"></i>
                        </button>
                    </div>
                </div>`;
            }).join('');
            
            lucide.createIcons();
        }

        // Event Listeners
        document.querySelector('.modal-overlay').addEventListener('click', closeModal);
        document.querySelectorAll('.modal-close').forEach(btn => btn.addEventListener('click', closeModal));
        document.getElementById('search-input').oninput = () => renderResults();

        window.onload = () => {
            renderSummary();
            renderResults();
            lucide.createIcons();
        };
    </script>
