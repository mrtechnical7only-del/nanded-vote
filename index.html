<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elector Anomaly Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-800 font-sans pb-10">

    <!-- Navbar -->
    <nav class="bg-indigo-700 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-shield-halved text-2xl text-indigo-300"></i>
                    <span class="font-bold text-xl tracking-tight hidden sm:inline-block">Elector Anomaly Tracker</span>
                    <span class="font-bold text-xl tracking-tight sm:hidden">Tracker</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="window.manualSync()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center border border-indigo-500 transition-colors shadow-sm">
                        <i class="fa-solid fa-cloud-arrow-up mr-2" id="sync-icon"></i> <span class="hidden sm:inline-block">Sync Data to Firebase</span>
                    </button>
                    <div id="firebase-status" class="text-sm font-medium bg-indigo-800 px-3 py-1 rounded-full border border-indigo-600 text-yellow-300 flex items-center">
                        <i class="fa-solid fa-spinner fa-spin mr-1"></i> Firebase Start...
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center">
                <div class="rounded-full bg-blue-100 p-3 mr-4"><i class="fa-solid fa-users text-xl text-blue-600"></i></div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Kul Record (Total)</p>
                    <p id="stat-total" class="text-2xl font-bold text-gray-900">0</p>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center">
                <div class="rounded-full bg-green-100 p-3 mr-4"><i class="fa-solid fa-circle-check text-xl text-green-600"></i></div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Hal Hua (Resolved)</p>
                    <p id="stat-resolved" class="text-2xl font-bold text-gray-900">0</p>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex items-center">
                <div class="rounded-full bg-orange-100 p-3 mr-4"><i class="fa-solid fa-clock text-xl text-orange-600"></i></div>
                <div>
                    <p class="text-sm text-gray-500 font-medium">Baki Hai (Pending)</p>
                    <p id="stat-pending" class="text-2xl font-bold text-gray-900">0</p>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-t-xl shadow-sm border border-gray-200 p-4 space-y-4">
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4">
                <div class="flex flex-col md:flex-row gap-4 w-full xl:w-auto">
                    <input type="number" id="search-srno" placeholder="Sr No." class="w-full md:w-40 px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="text" id="search-query" placeholder="Naam ya EPIC..." class="w-full md:w-64 px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                    <select id="filter-status" class="w-full md:w-auto px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="ALL">Sabhi Status (All)</option>
                        <option value="PENDING">Sirf Pending</option>
                        <option value="RESOLVED">Sirf Resolved</option>
                    </select>
                </div>
                <div class="flex flex-col md:flex-row w-full xl:w-auto gap-4 items-center">
                    <select id="filter-anomaly" class="w-full md:w-64 px-3 py-2 border border-gray-300 rounded-lg bg-indigo-50 text-indigo-800 font-medium outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="ALL">Koyi bhi Anomaly (All Types)</option>
                    </select>
                    <button onclick="window.openAddModal()" class="w-full md:w-auto bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center justify-center transition-colors shadow-sm whitespace-nowrap">
                        <i class="fa-solid fa-plus mr-2"></i> Add Record
                    </button>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-white shadow-sm border-x border-b border-gray-200 rounded-b-xl overflow-hidden">
            <div class="overflow-x-auto h-[600px] overflow-y-auto relative custom-scrollbar">
                <table class="min-w-full divide-y divide-gray-200 relative">
                    <thead class="bg-gray-100 sticky top-0 z-20 shadow-sm">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">Sr. No.</th>
                            <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase min-w-[200px]">Voter Info</th>
                            <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase min-w-[280px]">Select Anomalies</th>
                            <th class="px-4 py-3 text-center text-xs font-bold text-gray-500 uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modals (Add/Edit) -->
    <div id="form-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900 bg-opacity-60 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="bg-indigo-600 px-6 py-4 flex justify-between items-center text-white">
                <h3 id="form-modal-title" class="font-bold text-lg"><i class="fa-solid fa-user-plus mr-2"></i> Record Form</h3>
                <button onclick="window.closeFormModal()"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Serial Number *</label>
                    <input type="number" id="form-id" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Elector Name *</label>
                    <input type="text" id="form-name" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" required>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">EPIC Number *</label>
                    <input type="text" id="form-epic" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 uppercase" required>
                </div>
            </div>
            <div class="bg-gray-50 px-6 py-4 border-t flex justify-end space-x-3">
                <button onclick="window.closeFormModal()" class="bg-gray-200 text-gray-800 hover:bg-gray-300 px-4 py-2 rounded-lg font-medium transition-colors">Cancel</button>
                <button onclick="window.saveRecordForm()" class="bg-indigo-600 text-white hover:bg-indigo-700 px-6 py-2 rounded-lg font-medium transition-colors">Save</button>
            </div>
        </div>
    </div>

    <!-- View Modal -->
    <div id="view-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900 bg-opacity-60 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden max-h-[90vh] flex flex-col">
            <div class="bg-indigo-600 px-6 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-eye mr-2"></i> Voter Details</h3>
                <button onclick="window.closeModal()"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 custom-scrollbar">
                <div class="mb-6 bg-gray-50 p-4 rounded-xl border border-gray-200 grid grid-cols-2 gap-4">
                    <div><p class="text-xs text-gray-500 font-bold uppercase">Serial Number</p><p id="modal-srno" class="font-bold text-lg"></p></div>
                    <div><p class="text-xs text-gray-500 font-bold uppercase">EPIC</p><p id="modal-epic" class="font-bold text-indigo-700"></p></div>
                    <div class="col-span-2"><p class="text-xs text-gray-500 font-bold uppercase">Name</p><p id="modal-name" class="font-bold"></p></div>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-bold uppercase mb-3">Selected Anomalies</p>
                    <div id="modal-anomalies-container"></div>
                </div>
                <div class="mt-6 border-t pt-4" id="modal-status-container"></div>
            </div>
            <div class="bg-gray-50 px-6 py-4 border-t flex justify-end">
                <button onclick="window.closeModal()" class="bg-gray-200 text-gray-800 hover:bg-gray-300 font-medium px-4 py-2 rounded-lg">Close</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-xl flex items-center z-50 hidden transition-opacity">
        <i class="fa-solid fa-circle-check text-green-400 text-lg"></i>
        <span id="toast-message" class="font-medium text-sm ml-2"></span>
    </div>

            const filterStatus = document.getElementById('filter-status').value;
            const filterAnomaly = document.getElementById('filter-anomaly').value;

            window.appData.sort((a, b) => a.id - b.id);

            const filteredData = window.appData.filter(row => {
                const matchesSrNo = searchSrNo === '' || row.id.toString() === searchSrNo;
                const matchesQuery = row.name.toLowerCase().includes(searchQuery) || row.epic.toLowerCase().includes(searchQuery);
                const matchesStatus = filterStatus === 'ALL' ? true : (filterStatus === 'RESOLVED' ? row.isResolved : !row.isResolved);
                const matchesAnomalyFilter = filterAnomaly === 'ALL' ? true : row.anomalyTypes.includes(filterAnomaly);
                return matchesSrNo && matchesQuery && matchesStatus && matchesAnomalyFilter;

            document.getElementById('stat-resolved').innerText = window.appData.filter(d => d.isResolved).length;

            if (row) {

            const nameVal = document.getElementById('form-name').value.trim();
            const epicVal = document.getElementById('form-epic').value.trim().toUpperCase();

            if(!idNum || !nameVal || !epicVal) return window.showToast("Sabhi fields bharna zaroori hai!");

            let recordToSave;
            if (window.formMode === 'add') {
                if (window.appData.some(r => r.id === idNum)) return window.showToast("Ye Serial No pehle se maujood hai!");
                recordToSave = { id: idNum, name: nameVal, epic: epicVal, anomalyTypes: [], isResolved: false };
                window.appData.push(recordToSave);
            } else {
                const row = window.appData.find(r => r.id === window.formEditId);
                if(row) {
                    row.name = nameVal;
                    row.epic = epicVal;
                    recordToSave = row;
                }
            }
            
            // Sync specific record immediately to Firebase
            if (window.firebaseUser && window.dbRef && window.setDoc && window.doc) {
                try {
                    await window.setDoc(window.doc(window.dbRef, 'elector_anomalies', recordToSave.id.toString()), recordToSave, { merge: true });
                    window.showToast("Data saved to Firebase!");
                } catch(e) { console.error(e); }
            } else {
                window.showToast("Saved locally");
            }
            window.closeFormModal();
            window.renderApp();
        };

                const ul = document.createElement('ul'); ul.className = "space-y-2";
                row.anomalyTypes.forEach(a => ul.innerHTML += `<li class="flex items-start text-sm bg-red-50 text-red-800 p-3 rounded-lg border border-red-100"><i class="fa-solid fa-triangle-exclamation text-red-500 mr-2 mt-0.5"></i><span>${a}</span></li>`);
                anomaliesContainer.appendChild(ul);
            } else {
                anomaliesContainer.innerHTML = `<div class="text-center p-6 bg-green-50 rounded-xl border border-green-100"><p class="text-sm font-medium text-green-800">Koyi Anomaly select nahi ki gayi hai.</p></div>`;
            }
            document.getElementById('view-modal').classList.remove('hidden');
        };
        window.closeModal = () => document.getElementById('view-modal').classList.add('hidden');

        let toastTimer;
        window.showToast = (msg) => {
            document.getElementById('toast-message').innerText = msg;
            document.getElementById('toast').classList.remove('hidden');
            document.getElementById('toast').classList.add('flex');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { document.getElementById('toast').classList.add('hidden'); document.getElementById('toast').classList.remove('flex'); }, 3000);
        };

        // DOM Listeners
        document.getElementById('search-srno').addEventListener('input', window.renderApp);
        document.getElementById('search-query').addEventListener('input', window.renderApp);
        document.getElementById('filter-status').addEventListener('change', window.renderApp);
        document.getElementById('filter-anomaly').addEventListener('change', window.renderApp);
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown-container') && window.openDropdownId !== null) { window.openDropdownId = null; window.renderApp(); }
        });

        // ==========================================
        // 3. FIREBASE CONNECTION & SYNC LOGIC
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyC0XJ0hQjhuSkFjx-RnIJeUSRzHRISNt4E",
            authDomain: "voters-ac217.firebaseapp.com",
            databaseURL: "https://voters-ac217-default-rtdb.firebaseio.com",
            projectId: "voters-ac217",
            storageBucket: "voters-ac217.firebasestorage.app",
            messagingSenderId: "98307843068",
            appId: "1:98307843068:web:b091e8b6de83ed9ffc0879"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            window.dbRef = getFirestore(app);

            // Export references for inline handlers
            window.setDoc = setDoc;
            window.doc = doc;

            signInAnonymously(auth).then((result) => {
                window.firebaseUser = result.user;
                const statusEl = document.getElementById('firebase-status');
                statusEl.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> Sync Active';
                statusEl.classList.replace('text-yellow-300', 'text-green-300');

                // 🌟 Firebase Recall Logic
                onSnapshot(collection(window.dbRef, 'elector_anomalies'), (snapshot) => {
                    const dbData = {};
                    snapshot.forEach(doc => { dbData[doc.id] = doc.data(); });
                    
                    // Merge DB data with local App Data (DB has priority)
                    let mergedData = RAW_DATA.map(item => ({
                        ...item,
                        name: dbData[item.id]?.name || item.name, 
                        epic: dbData[item.id]?.epic || item.epic,
                        anomalyTypes: dbData[item.id]?.anomalyTypes || item.anomalyTypes || [],
                        isResolved: dbData[item.id]?.isResolved || item.isResolved || false
                    }));

                    // Add new records that exist in DB but not in RAW_DATA
                    Object.keys(dbData).forEach(dbId => {
                        const numId = parseInt(dbId);
                        if (!RAW_DATA.find(item => item.id === numId)) {
                            mergedData.push({
                                id: numId,
                                name: dbData[dbId].name || 'Unknown',
                                epic: dbData[dbId].epic || 'Unknown',
                                anomalyTypes: dbData[dbId].anomalyTypes || [],
                                isResolved: dbData[dbId].isResolved || false
                            });
                        }
                    });

                    window.appData = mergedData;
                    window.renderApp();
                });
            }).catch(error => {
                console.error("Auth error", error);
                document.getElementById('firebase-status').innerHTML = '<i class="fa-solid fa-circle-xmark mr-1"></i> Check Rules/Auth';
                document.getElementById('firebase-status').classList.replace('text-yellow-300', 'text-red-300');
            });
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        // Save a single row when Checkmark / floppy icon is clicked
        window.saveRowToFirebase = async (id) => {
            const row = window.appData.find(r => r.id === id);
            if (!window.firebaseUser || !window.dbRef) { window.openDropdownId = null; window.renderApp(); window.showToast("Local save (Firebase off)"); return; }
            try {
                await setDoc(doc(window.dbRef, 'elector_anomalies', id.toString()), {
                    name: row.name, epic: row.epic, anomalyTypes: row.anomalyTypes, isResolved: row.isResolved, updatedAt: new Date().toISOString()
                }, { merge: true });
                window.showToast("Data saved to Firebase!");
            } catch (error) { window.showToast("Save Failed! Permission check karein."); }
            window.openDropdownId = null;
            window.renderApp();
        };

        window.toggleResolveStatus = async (id) => {
            const row = window.appData.find(r => r.id === id);
            row.isResolved = !row.isResolved;
            if(row.isResolved) window.openDropdownId = null;
            window.renderApp();

            if (window.firebaseUser && window.dbRef) {
                try {
                    await setDoc(doc(window.dbRef, 'elector_anomalies', id.toString()), { isResolved: row.isResolved, updatedAt: new Date().toISOString() }, { merge: true });
                    window.showToast(row.isResolved ? "Marked Resolved!" : "Marked Pending!");
                } catch (error) { row.isResolved = !row.isResolved; window.renderApp(); window.showToast("Sync Error!"); }
            }
        };

        // 🌟 "Sync Data" Button Logic (Push All ~280 items to Firebase)
        window.manualSync = async () => {
            document.getElementById('sync-icon').classList.add('fa-spin');
            
            if (window.firebaseUser && window.dbRef) {
                try {
                    const batch = writeBatch(window.dbRef);

                    // Har ek row ko batch me daalna
                    window.appData.forEach(row => {
                        const docRef = doc(window.dbRef, 'elector_anomalies', row.id.toString());
                        batch.set(docRef, {
                            name: row.name,
                            epic: row.epic,
                            anomalyTypes: row.anomalyTypes,
                            isResolved: row.isResolved,
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                    });

                    // Ek saath sabko Firebase bhej dena (Maximum batch size 500 hota hai, 280 ek dum safe hai)
                    await batch.commit();

                    window.showToast("Sync Successful! Sabhi 280+ Records Firebase me upload ho gaye.");
                } catch (e) {
                    console.error("Manual sync error: ", e);
                    window.showToast("Sync Failed! Firestore Rules check karein.");
                }
            } else { window.showToast("Firebase offline hai."); }
            
            setTimeout(() => document.getElementById('sync-icon').classList.remove('fa-spin'), 1000);
        };
    </script>
</body>
</html>
